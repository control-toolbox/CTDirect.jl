name: Breakage

# The packages that depend on CTDirect, tested against it; one report per run. On push to
# main and by hand, the run is the baseline the next release PR compares with (REL1); see
# CTActions docs/workflows/breakage-suite.md.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  call:
    # A 'labeled' event fires once per label added, and re-evaluates against the PR's
    # *current* full label set — so adding several labels in a row would otherwise
    # re-run this job on every subsequent label add. Only react to 'labeled' when it's
    # this specific label; for other trigger types (synchronize/reopened), fall back to
    # checking the current label set as before. On push to main and by hand, always.
    if: >
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run breakage') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run breakage'))
    uses: control-toolbox/CTActions/.github/workflows/breakage-suite.yml@main
    with:
      targets: >-
        [{"name": "OptimalControl"}]
      use_ct_registry: true
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
