version = "2.0.0"
kind = "stable"
mode = "supervised"  # supervised or autonomous: the human's choice
requested_by = "ocots"    # the GitHub login of the person who validated the proposal
reference = "1.0.12"
base = "0b308c6866b38cb191360c96c4d35ec24762a560"

[versions]
ct_agents = "v0.5.0"
ct_conventions = "v0.13.0"
